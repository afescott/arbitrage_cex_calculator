[package]
name = "security_flamegraph_lowlatency"
version = "0.1.0"
edition = "2021"

[features]
default = []
## Centralized exchange WebSocket feeds (Binance, Kraken) + Binance futures HMAC signing.
cex = ["dep:hmac", "dep:sha2", "dep:hex"]
## Optional CSV metrics writer (order attempts + run summary).
csv = []
## dYdX v4 indexer WS market data + relay execution.
dydx = []
## Bitget perps (mix) WS market data + HMAC REST execution.
bitget = ["dep:hmac", "dep:sha2", "dep:hex", "dep:base64"]
## OpenTelemetry OTLP/gRPC trace export (per-route execution spans → Jaeger).
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# HTTP execution (Hyperliquid, dYdX relay, Binance)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
base64 = { version = "0.22", optional = true }
# Hyperliquid signing + trading (EIP-712)
hypersdk = "0.2.9"
rust_decimal = "1.39"
# Order book dependencies
crossbeam-queue = "0.3"
dashmap = "5.5"
uuid = { version = "1.6", features = ["v4", "serde"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
pricelevel = "0.4.2"
# In-process latency histograms for hot-path telemetry.
hdrhistogram = "7"
# OpenTelemetry stack (opt-in via `--features otel`). Versions chosen together to
# match opentelemetry-rust 0.32 release train + tracing-opentelemetry 0.33.
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true, features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = { version = "0.33", optional = true }

[profile.release]
lto = true
codegen-units = 1
debug = true  # Enable debuginfo for flamegraph profiling
